<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🏬 Store Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f5;--card:#fff;--ink:#111;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;--brand:#0c831f;--brand-bg:#e8faed;--brand-dk:#096b18;--blue:#2563eb;--blue-bg:#eff6ff;--orange:#ea580c;--orange-bg:#fff7ed;--red:#dc2626;--red-bg:#fef2f2;--yellow:#d97706;--yellow-bg:#fffbeb;--line:#e5e7eb;--f:'DM Sans',system-ui,sans-serif;--r:8px;--r2:12px;--r3:16px;--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 12px rgba(0,0,0,.08)}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh}

/* PIN Lock */
.lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#065a14,var(--brand));display:flex;align-items:center;justify-content:center;padding:20px}.lock.hidden{display:none}
.lock-box{background:var(--card);border-radius:var(--r3);padding:36px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lock-box h2{font-size:18px;font-weight:700;margin:8px 0 4px}.lock-box p{font-size:13px;color:var(--ink3);margin-bottom:20px}
.pin-inputs{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pin-inputs input{width:48px;height:56px;text-align:center;font:700 22px var(--f);border:2px solid var(--line);border-radius:var(--r2);outline:none;background:var(--bg);color:var(--ink);-webkit-text-security:disc}.pin-inputs input:focus{border-color:var(--brand);background:var(--card)}
.pin-inputs input.shake{animation:shake .4s ease}
.pin-err{color:var(--red);font-size:12px;font-weight:600;min-height:18px;margin-bottom:12px}
.pin-submit{width:100%;height:46px;border:none;border-radius:var(--r);background:var(--brand);color:#fff;font:700 15px var(--f);cursor:pointer}.pin-submit:hover{background:var(--brand-dk)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Top Bar */
.top{background:linear-gradient(135deg,#065a14,var(--brand));color:#fff;padding:14px 20px;position:sticky;top:0;z-index:50}
.top-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;align-items:center;gap:6px}
.top-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font:600 11px var(--f);padding:7px 12px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;gap:4px}.top-btn:hover{background:rgba(255,255,255,.3)}

/* Main Tabs */
.main-tabs{display:flex;max-width:960px;margin:0 auto;padding:0 20px;border-bottom:2px solid var(--line);background:var(--card)}
.main-tab{flex:1;padding:12px 0;text-align:center;font:700 13px var(--f);color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;position:relative}.main-tab:hover{color:var(--ink)}.main-tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-alert{position:absolute;top:6px;right:calc(50% - 40px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.tab-alert.show{display:block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.low-stock-banner{background:var(--red-bg);border:1px solid #fca5a5;border-radius:var(--r2);padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--red);display:none}
.low-stock-banner.show{display:block}
.low-stock-banner strong{font-weight:700}
.stock-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:4px}
.sb-ok{background:var(--brand-bg);color:var(--brand)}.sb-low{background:var(--orange-bg);color:var(--orange)}.sb-out{background:var(--red-bg);color:var(--red)}
.main-panel{display:none;max-width:960px;margin:0 auto}.main-panel.active{display:block}

/* Date row (orders) */
.top-row2{display:flex;align-items:center;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.top-row2::-webkit-scrollbar{display:none}
.date-chip{height:32px;padding:0 12px;border:1.5px solid rgba(255,255,255,.25);border-radius:var(--r);background:transparent;color:rgba(255,255,255,.8);font:600 11px var(--f);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}.date-chip:hover{background:rgba(255,255,255,.12)}.date-chip.active{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
.date-chip input[type=date]{background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;width:110px;outline:none}.date-chip input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}.date-chip.active input[type=date]::-webkit-calendar-picker-indicator{filter:none}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 20px}
.stat{background:var(--card);border-radius:var(--r2);padding:12px 10px;text-align:center;border:1px solid var(--line);cursor:pointer;transition:.2s}.stat:hover{box-shadow:var(--sh);transform:translateY(-1px)}.stat.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-bg)}
.stat-n{font-size:22px;font-weight:800;line-height:1.1}.stat-l{font-size:9px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}.stat-rev{font-size:9px;color:var(--ink4);margin-top:2px}
.s-total .stat-n{color:var(--ink)}.s-new .stat-n{color:var(--brand)}.s-conf .stat-n{color:var(--blue)}.s-pack .stat-n{color:var(--orange)}.s-done .stat-n{color:var(--ink3)}

/* Filter bar */
.filter-bar{padding:8px 20px;display:flex;gap:8px;align-items:center}
.search-box{flex:1;position:relative}.search-box input{width:100%;height:36px;padding:0 12px 0 34px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);background:var(--card);color:var(--ink);outline:none}.search-box input:focus{border-color:var(--brand)}.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink4)}
.sort-btn{height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);font:600 11px var(--f);color:var(--ink3);cursor:pointer;white-space:nowrap}.sort-btn.active{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}

/* Orders */
.orders{padding:6px 20px 100px;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:48px 16px;color:var(--ink4);font-size:13px}
.order{background:var(--card);border-radius:var(--r2);border:1px solid var(--line);overflow:hidden;transition:.2s}.order:hover{box-shadow:var(--sh2);border-color:var(--brand);transform:translateY(-1px)}
.order.new-pulse{animation:newPulse 2s ease infinite}
@keyframes newPulse{0%,100%{border-color:var(--line)}50%{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}}
.order-head{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.order-mode-icon{width:34px;height:34px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}.mi-pickup{background:var(--brand-bg)}.mi-delivery{background:var(--blue-bg)}
.order-info{flex:1;min-width:0}.order-top-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.order-id{font-size:11px;font-weight:700;color:var(--brand)}.order-ago{font-size:10px;color:var(--ink4);margin-left:auto}
.order-name{font-size:13px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-meta{font-size:10px;color:var(--ink4);display:flex;gap:6px}
.order-right{text-align:right;flex-shrink:0}.order-amt{font-size:14px;font-weight:700}.order-cnt{font-size:10px;color:var(--ink4)}
.status-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.st-new{background:var(--brand-bg);color:var(--brand)}.st-conf{background:var(--blue-bg);color:var(--blue)}.st-pack{background:var(--orange-bg);color:var(--orange)}.st-done{background:#f3f4f6;color:var(--ink3)}.st-cancel{background:var(--red-bg);color:var(--red)}
.order-body{display:none;border-top:1px solid var(--line);padding:12px 14px}.order.open .order-body{display:block}
.ob-section{margin-bottom:10px}.ob-label{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ob-items{font-size:12px;color:var(--ink2);line-height:1.7;white-space:pre-wrap}
.ob-contact{display:flex;gap:6px;flex-wrap:wrap}.ob-chip{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink2);background:var(--bg);padding:5px 10px;border-radius:var(--r)}.ob-chip a{color:var(--brand);font-weight:700;text-decoration:none}
.ob-addr{font-size:11px;color:var(--ink2);background:var(--yellow-bg);padding:8px 12px;border-radius:var(--r);border-left:3px solid var(--yellow)}
.sa{display:flex;gap:6px;flex-wrap:wrap}
.sa-btn{height:36px;padding:0 14px;border:none;border-radius:var(--r);font:700 11px var(--f);cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s;flex:1;justify-content:center;min-width:80px}.sa-btn:active{transform:scale(.95)}
.sa-confirm{background:var(--blue);color:#fff}.sa-pack{background:var(--orange);color:#fff}.sa-done{background:var(--brand);color:#fff}.sa-cancel{background:var(--card);color:var(--red);border:1.5px solid var(--line)}.sa-wa{background:#25d366;color:#fff}.sa-call{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}
.sa-print{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}.sa-print:hover{background:var(--bg)}

/* Config Panel */
.cfg-panel{padding:12px 20px 100px}
.cfg-search{width:100%;height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);background:var(--card);color:var(--ink);outline:none;margin-bottom:10px}.cfg-search:focus{border-color:var(--brand)}
.cfg-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-bottom:6px;transition:.15s}
.cfg-item:hover{border-color:var(--brand);box-shadow:var(--sh)}
.cfg-item.changed{border-left:3px solid var(--brand);background:var(--brand-bg)}
.cfg-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cfg-key{font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;min-width:100px}
.cfg-badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.cfg-badge.req{background:var(--red-bg);color:var(--red)}.cfg-badge.fee{background:var(--orange-bg);color:var(--orange)}.cfg-badge.seo{background:var(--blue-bg);color:var(--blue)}.cfg-badge.ui{background:rgba(168,85,247,.1);color:#8b5cf6}
.cfg-row{display:flex;gap:8px;align-items:center}
.cfg-val{flex:1;height:34px;padding:0 10px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);color:var(--ink);outline:none;transition:.2s}.cfg-val:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(12,131,31,.08)}
.cfg-val-long{height:56px;padding:6px 10px;resize:none;font:500 11px var(--f)}
.cfg-save{height:34px;padding:0 14px;border:none;border-radius:var(--r);background:var(--brand);color:#fff;font:700 11px var(--f);cursor:pointer;flex-shrink:0;transition:.15s}.cfg-save:hover{background:var(--brand-dk)}.cfg-save:active{transform:scale(.95)}
.cfg-save.saved{background:var(--brand-bg);color:var(--brand)}
.cfg-history{font-size:10px;color:var(--ink4);margin-top:4px;display:none}.cfg-item:hover .cfg-history{display:block}
.cfg-history span{color:var(--ink3)}
.cfg-add{background:var(--card);border:2px dashed var(--line);border-radius:var(--r2);padding:12px;text-align:center;cursor:pointer;color:var(--ink3);font:600 12px var(--f);transition:.15s}.cfg-add:hover{border-color:var(--brand);color:var(--brand)}
.cfg-hist-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:12px}
.cfg-hist-title{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.cfg-hist-title button{font:600 10px var(--f);color:var(--red);background:0;border:0;cursor:pointer;padding:2px 8px}
.cfg-hist-list{max-height:200px;overflow-y:auto}
.cfg-hist-entry{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:11px}
.cfg-hist-entry:last-child{border-bottom:none}
.cfg-hist-dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px}
.cfg-hist-key{font-weight:700;color:var(--ink)}
.cfg-hist-old{color:var(--red);text-decoration:line-through}
.cfg-hist-new{color:var(--brand);font-weight:600}
.cfg-hist-time{color:var(--ink4);font-size:9px;margin-left:auto;flex-shrink:0;white-space:nowrap}

/* Products Panel */
.prod-panel{padding:12px 20px 100px}
.prod-bar{display:flex;gap:8px;margin-bottom:10px}
.prod-search{flex:1;height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);background:var(--card);color:var(--ink);outline:none}.prod-search:focus{border-color:var(--brand)}
.prod-add-btn{height:36px;padding:0 14px;border:none;border-radius:var(--r);background:var(--brand);color:#fff;font:700 12px var(--f);cursor:pointer;white-space:nowrap}.prod-add-btn:hover{background:var(--brand-dk)}
.prod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:6px;overflow:hidden}.prod-card:hover{box-shadow:var(--sh)}
.prod-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.prod-img{width:40px;height:40px;border-radius:var(--r);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-info{flex:1;min-width:0}.prod-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prod-meta{font-size:10px;color:var(--ink3);display:flex;gap:6px}
.prod-price{font-size:14px;font-weight:700;color:var(--brand);flex-shrink:0}
.prod-body{display:none;border-top:1px solid var(--line);padding:14px}.prod-card.open .prod-body{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-group{display:flex;flex-direction:column;gap:3px}.form-group.full{grid-column:1/-1}
.form-label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.form-input{height:34px;padding:0 10px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);color:var(--ink);outline:none}.form-input:focus{border-color:var(--brand)}
.form-textarea{height:56px;padding:6px 10px;border:1.5px solid var(--line);border-radius:var(--r);font:500 12px var(--f);color:var(--ink);outline:none;resize:none}.form-textarea:focus{border-color:var(--brand)}
.form-actions{display:flex;gap:6px;grid-column:1/-1;margin-top:4px}
.btn{height:36px;padding:0 16px;border:none;border-radius:var(--r);font:700 12px var(--f);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}.btn:active{transform:scale(.96)}
.btn-green{background:var(--brand);color:#fff}.btn-green:hover{background:var(--brand-dk)}
.btn-red{background:var(--red-bg);color:var(--red)}.btn-gray{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--r3);max-width:440px;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:10px 20px;border-radius:var(--r2);font:600 12px var(--f);z-index:200;opacity:0;transition:.3s}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.loading{text-align:center;padding:48px}.loading-spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:640px){.top h1{font-size:15px}.stats{gap:4px;padding:8px 12px}.stat{padding:8px 4px}.stat-n{font-size:16px}.stat-rev{display:none}.filter-bar,.cfg-panel,.prod-panel{padding-left:12px;padding-right:12px}.orders{padding:4px 12px 100px}.sa{flex-direction:column}.cfg-item{flex-wrap:wrap}.cfg-key{min-width:auto;width:100%}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- PIN Lock -->
<div class="lock" id="lockScreen"><div class="lock-box"><div style="font-size:36px">🔐</div><h2>Store Dashboard</h2><p>Enter PIN to manage your store</p><div class="pin-inputs"><input type="tel" maxlength="1" id="p1" oninput="pinNext(this,2)" onkeydown="pinBack(event,0)" autofocus><input type="tel" maxlength="1" id="p2" oninput="pinNext(this,3)" onkeydown="pinBack(event,1)"><input type="tel" maxlength="1" id="p3" oninput="pinNext(this,4)" onkeydown="pinBack(event,2)"><input type="tel" maxlength="1" id="p4" oninput="pinNext(this,0)" onkeydown="pinBack(event,3)"></div><div class="pin-err" id="pinErr"></div><button class="pin-submit" onclick="checkPin()">Unlock</button></div></div>

<!-- Top Bar -->
<div class="top"><div class="top-row1"><h1>🏬 Store Dashboard</h1><div class="top-actions"><span style="font-size:10px;opacity:.6" id="lastUpdate"></span><button class="top-btn" onclick="refreshCurrentTab()" id="refreshBtn">↻</button><button class="top-btn" onclick="lockDashboard()">🔒</button></div></div><div class="top-row2" id="dateRow"></div></div>

<!-- Main Tabs -->
<div class="main-tabs"><div class="main-tab active" onclick="switchMain('orders',this)">📋 Orders</div><div class="main-tab" onclick="switchMain('config',this)">⚙️ Settings</div><div class="main-tab" onclick="switchMain('products',this)">📦 Products<span class="tab-alert" id="stockAlert"></span></div></div>

<!-- ORDERS PANEL -->
<div class="main-panel active" id="panelOrders">
<div class="stats"><div class="stat s-total active" onclick="filterStat('all')"><div class="stat-n" id="cntAll">-</div><div class="stat-l">All</div><div class="stat-rev" id="revAll"></div></div><div class="stat s-new" onclick="filterStat('new')"><div class="stat-n" id="cntNew">-</div><div class="stat-l">New</div><div class="stat-rev" id="revNew"></div></div><div class="stat s-conf" onclick="filterStat('confirmed')"><div class="stat-n" id="cntConf">-</div><div class="stat-l">Confirmed</div><div class="stat-rev" id="revConf"></div></div><div class="stat s-pack" onclick="filterStat('packed')"><div class="stat-n" id="cntPack">-</div><div class="stat-l">Packed</div><div class="stat-rev" id="revPack"></div></div><div class="stat s-done" onclick="filterStat('done')"><div class="stat-n" id="cntDone">-</div><div class="stat-l">Done</div><div class="stat-rev" id="revDone"></div></div></div>
<div class="filter-bar"><div class="search-box"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg><input type="text" id="searchInput" placeholder="Search orders..." oninput="applyFilters()"></div><button class="sort-btn active" id="sortBtn" onclick="toggleSort()">⚡ Priority</button></div>
<div class="orders" id="ordersList"><div class="loading"><div class="loading-spin"></div></div></div>
</div>

<!-- CONFIG PANEL -->
<div class="main-panel" id="panelConfig">
<div class="cfg-panel">
<input type="text" class="cfg-search" id="cfgSearch" placeholder="Search config keys..." oninput="renderConfig()">
<div class="cfg-hist-panel" id="cfgHistPanel" style="display:none">
<div class="cfg-hist-title"><span>📜 Recent Changes</span><button onclick="clearConfigHistory()">Clear</button></div>
<div class="cfg-hist-list" id="cfgHistList"></div>
</div>
<div id="configList"><div class="loading"><div class="loading-spin"></div></div></div>
<div class="cfg-add" onclick="addConfigRow()">+ Add Config Key</div>
</div>
</div>

<!-- PRODUCTS PANEL -->
<div class="main-panel" id="panelProducts">
<div class="prod-panel"><div class="low-stock-banner" id="lowStockBanner"></div><div class="prod-bar"><input type="text" class="prod-search" id="prodSearch" placeholder="Search products..." oninput="renderProducts()"><button class="prod-add-btn" onclick="openAddProduct()">+ Add</button></div><div id="productList"><div class="loading"><div class="loading-spin"></div></div></div></div>
</div>

<!-- Add/Edit Product Modal -->

function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function timeAgo(ds){if(!ds)return '';var d;var p=ds.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2}):?(\d{2})?\s*(am|pm)?/i);if(p){var h=parseInt(p[4]),m=parseInt(p[5]);if(p[7]){if(p[7].toLowerCase()==='pm'&&h!==12)h+=12;if(p[7].toLowerCase()==='am'&&h===12)h=0}d=new Date(p[3],p[2]-1,p[1],h,m,p[6]?parseInt(p[6]):0)}else d=new Date(ds);if(isNaN(d))return '';var diff=Math.floor((Date.now()-d)/1000);if(diff<60)return 'Just now';if(diff<3600)return Math.floor(diff/60)+'m';if(diff<86400)return Math.floor(diff/3600)+'h';return Math.floor(diff/86400)+'d'}

function loadOrders(){$('refreshBtn').innerHTML='<span style="display:inline-block;animation:spin .6s linear infinite">↻</span>';loadSheet('Orders',function(r){$('refreshBtn').innerHTML='↻';if(!r||!r.table){$('ordersList').innerHTML='<div class="empty">No orders yet.</div>';return}var cols=r.table.cols.map(function(c){return(c.label||'').toLowerCase().trim()});allOrders=(r.table.rows||[]).map(function(row){var o={};cols.forEach(function(k,i){var c=row.c&&row.c[i];o[k]=c?(c.v!=null?String(c.v).trim():''):''});return{id:o['order id']||o.orderid||'',date:o['date & time']||o.date||'',dateKey:parseOrderDate(o['date & time']||o.date||''),mode:(o.mode||'').toLowerCase(),name:o['customer name']||o.name||'',phone:o.phone||'',email:o.email||'',address:o.address||'',items:o.items||'',total:parseFloat(o['total (₹)']||o.total||o['total']||'0')||0,status:(o.status||'new').toLowerCase().trim()}}).filter(function(o){return o.id}).reverse();var nc=allOrders.filter(function(o){return o.status==='new'}).length;if(nc>prevNewCount&&prevNewCount>0)playNotif();prevNewCount=nc;$('lastUpdate').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});applyFilters()})}

// CONFIG TAB — with history tracking

var configHistory=[];
try{configHistory=JSON.parse(localStorage.getItem('sl_config_history_'+SHEET_ID)||'[]')}catch(e){configHistory=[]}

function getConfigCategory(key){
  var k=key.toLowerCase();
  if(['shopname','phone','whatsapp','address','orderscript','upi','email'].indexOf(k)>=0)return{badge:'req',label:'Required'};
  if(k.indexOf('fee')>=0||k.indexOf('delivery')>=0||k.indexOf('minorder')>=0||k.indexOf('discount')>=0||k.indexOf('night')>=0)return{badge:'fee',label:'Fee'};
  if(['ogimage','analyticsid','shoptype','city','mapembed','maplink'].indexOf(k)>=0)return{badge:'seo',label:'SEO'};
  if(k.indexOf('hero')>=0||k.indexOf('tagline')>=0||k.indexOf('logo')>=0||k.indexOf('brand')>=0||k.indexOf('theme')>=0||k.indexOf('announcement')>=0||k.indexOf('search')>=0||k.indexOf('hi_')>=0)return{badge:'ui',label:'UI'};
  return null;
}

function getLastChange(key){
  var entry=null;
  for(var i=configHistory.length-1;i>=0;i--){
    if(configHistory[i].key===key){entry=configHistory[i];break}
  }
  return entry;
}

function loadConfig(){loadSheet('Config',function(r){configData=[];if(r&&r.table)(r.table.rows||[]).forEach(function(row){var k=row.c&&row.c[0]&&row.c[0].v!=null?String(row.c[0].v).trim():'';var v=row.c&&row.c[1]&&row.c[1].v!=null?String(row.c[1].v).trim():'';if(k)configData.push({key:k,value:v})});renderConfig();renderConfigHistory()})}

function renderConfig(){
  var q=($('cfgSearch')?$('cfgSearch').value:'').toLowerCase();
  var list=configData;
  if(q)list=list.filter(function(c){return(c.key+c.value).toLowerCase().indexOf(q)>=0});
  if(!list.length){$('configList').innerHTML='<div class="empty">'+(q?'No keys match "'+esc(q)+'"':'No config found.')+'</div>';return}
  $('configList').innerHTML=list.map(function(c){
    var idx=configData.indexOf(c);
    var cat=getConfigCategory(c.key);
    var lastChange=getLastChange(c.key);
    var isLong=c.value.length>50||c.key.toLowerCase().indexOf('map')>=0||c.key.toLowerCase().indexOf('script')>=0;
    var h='<div class="cfg-item" id="cfgItem-'+idx+'">';
    h+='<div class="cfg-top"><div class="cfg-key">'+esc(c.key)+'</div>';
    if(cat)h+='<span class="cfg-badge '+cat.badge+'">'+cat.label+'</span>';
    h+='</div>';
    h+='<div class="cfg-row">';
    h+=isLong?'<textarea class="cfg-val cfg-val-long" id="cfg-'+idx+'">'+esc(c.value)+'</textarea>':'<input class="cfg-val" id="cfg-'+idx+'" value="'+esc(c.value)+'">';
    h+='<button class="cfg-save" id="cfgBtn-'+idx+'" onclick="saveConfig('+idx+')">Save</button>';
    h+='</div>';
    if(lastChange){
      h+='<div class="cfg-history"><span>Last changed: </span>'+timeAgoShort(lastChange.time)+' — <span class="cfg-hist-old">'+esc((lastChange.old||'').substring(0,30))+'</span> → <span class="cfg-hist-new">'+esc((lastChange.new||'').substring(0,30))+'</span></div>';
    }
    h+='</div>';
    return h;
  }).join('');
}

function saveConfig(i){
  var c=configData[i],el=$('cfg-'+i);
  var oldVal=c.value;
  var newVal=el.value.trim();
  if(oldVal===newVal){showToast('No changes to save');return}
  // Save to sheet
  sendCmd('action=updateConfig&key='+encodeURIComponent(c.key)+'&value='+encodeURIComponent(newVal),function(){
    // Record in history
    configHistory.push({key:c.key,old:oldVal,new:newVal,time:Date.now()});
    // Keep only last 50 entries
    if(configHistory.length>50)configHistory=configHistory.slice(-50);
    try{localStorage.setItem('sl_config_history_'+SHEET_ID,JSON.stringify(configHistory))}catch(e){}
    configData[i].value=newVal;
    // Visual feedback
    var btn=$('cfgBtn-'+i);

function timeAgoShort(ts){
  if(!ts)return'';
  var diff=Math.floor((Date.now()-ts)/1000);
  if(diff<60)return'Just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  if(diff<604800)return Math.floor(diff/86400)+'d ago';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}

var dashPIN='',dashPINHash='';
var pinAttempts=0,pinLockUntil=0;
try{pinAttempts=parseInt(sessionStorage.getItem('pin_attempts')||'0');pinLockUntil=parseInt(sessionStorage.getItem('pin_lockuntil')||'0')}catch(e){}

function pinNext(el,n){if(el.value.length===1&&n>0)$('p'+n).focus();if(n===0&&el.value.length===1)checkPin()}
function pinBack(e,i){if(e.key==='Backspace'&&i>0&&e.target.value==='')$('p'+i).focus()}

function checkPin(){
  if(pinLockUntil&&Date.now()<pinLockUntil){
    var mins=Math.ceil((pinLockUntil-Date.now())/60000);
    $('pinErr').textContent='Too many attempts. Try in '+mins+' min.';
    return;
  }
  var entered=($('p1').value||'')+($('p2').value||'')+($('p3').value||'')+($('p4').value||'');
  if(entered.length<4)return;
  
  sha256(entered).then(function(enteredHash){
    var match=false;
    if(dashPINHash&&enteredHash===dashPINHash){
      match=true;handlePinResult(match);return;
    }
    if(dashPIN){
      sha256(dashPIN).then(function(storedHash){
        if(enteredHash===storedHash)match=true;
        handlePinResult(match);
      });return;
    }
    handlePinResult(match);
  });
}

function sha256(str){
  var encoder=new TextEncoder();
  return crypto.subtle.digest('SHA-256',encoder.encode(str)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
  });
}

function handlePinResult(match){
  if(match){
    pinAttempts=0;
    sessionStorage.setItem('pin_attempts','0');
    sessionStorage.removeItem('pin_lockuntil');
    sessionStorage.setItem('dash_unlocked','1');
    sessionStorage.setItem('dash_unlock_time',String(Date.now()));
    $('lockScreen').classList.add('hidden');
    startDashboard();
  }else{
    pinAttempts++;
    sessionStorage.setItem('pin_attempts',String(pinAttempts));
    if(pinAttempts>=5){
      pinLockUntil=Date.now()+5*60*1000;
      sessionStorage.setItem('pin_lockuntil',String(pinLockUntil));
      $('pinErr').textContent='Too many wrong attempts. Locked for 5 minutes.';
    }else{
      $('pinErr').textContent='Wrong PIN ('+(5-pinAttempts)+' attempts left)';
    }
    document.querySelectorAll('.pin-inputs input').forEach(function(el){el.classList.add('shake');setTimeout(function(){el.classList.remove('shake')},400)});
    setTimeout(function(){$('p1').value='';$('p2').value='';$('p3').value='';$('p4').value='';$('p1').focus()},500);
  }
}

function lockDashboard(){
  sessionStorage.removeItem('dash_unlocked');
  sessionStorage.removeItem('dash_unlock_time');
  $('lockScreen').classList.remove('hidden');
  $('p1').value='';$('p2').value='';$('p3').value='';$('p4').value='';$('p1').focus();
  if(orderInterval)clearInterval(orderInterval);
}

function isDashSessionValid(){
  var unlocked=sessionStorage.getItem('dash_unlocked');
  var time=parseInt(sessionStorage.getItem('dash_unlock_time')||'0');
  if(!unlocked)return false;
  // Session expires after 4 hours
  if(time&&Date.now()-time>4*60*60*1000){lockDashboard();return false}
  return true;
}

function startDashboard(){buildDateChips();loadOrders();orderInterval=setInterval(loadOrders,30000)}

function initDashboard(){loadSheet('Config',function(r){
  var gaId='';
  if(r&&r.table&&r.table.rows)r.table.rows.forEach(function(row){
    var k=row.c&&row.c[0]&&row.c[0].v?String(row.c[0].v).trim().toLowerCase().replace(/\s+/g,''):'';
    var v=row.c&&row.c[1]&&row.c[1].v?String(row.c[1].v).trim():'';
    if(k==='dashboardpin'||k==='dashpin'||k==='pin')dashPIN=v;
    if(k==='pinhash'||k==='dashboardpinhash')dashPINHash=v;
    if(k==='analyticsid')gaId=v;
  });
  // GA4
  if(gaId&&!window._gaLoaded){
    window._gaLoaded=true;
    var gs=document.createElement('script');gs.async=true;gs.src='https://www.googletagmanager.com/gtag/js?id='+gaId;document.head.appendChild(gs);
    window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};
    gtag('js',new Date());gtag('config',gaId,{page_title:'Store Dashboard'});
  }
  // Auth check
  if(!dashPIN&&!dashPINHash){
    // No PIN configured — open directly
    $('lockScreen').classList.add('hidden');startDashboard();
  }else if(isDashSessionValid()){
    // Valid session — skip PIN
    $('lockScreen').classList.add('hidden');startDashboard();
  }else{
    // Show PIN screen
    // Check if locked out
    if(pinLockUntil&&Date.now()<pinLockUntil){
      var mins=Math.ceil((pinLockUntil-Date.now())/60000);
      $('pinErr').textContent='Locked. Try in '+mins+' min.';
    }
    setTimeout(function(){$('p1').focus()},300);
  }
})}
